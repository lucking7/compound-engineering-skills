name: sync-upstream

# Follow the latest upstream `compound-engineering-v*` release. Deterministic risk-tiered sync:
#   content-only edits  -> auto-merge PR (validate gates run on it; merges without human action,
#                          but leaves a reviewable PR + commit trail)
#   structural change   -> PR held for human review (never auto-merged)
# Pure regeneration (no patch/merge), no LLM, no extra secrets — uses the built-in GITHUB_TOKEN only.
on:
  schedule:
    - cron: '17 7 * * 1'        # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Regenerate skills/ + manifest from the latest upstream release (pinned to a commit SHA,
      # stamped into the manifest), then classify the change.
      # ce-transform exits non-zero on any gate failure -> this step fails -> nothing is committed.
      - name: Regenerate from upstream + classify
        id: sync
        run: bash .deplugin/ce-sync.sh

      # Belt-and-suspenders: re-validate the freshly regenerated tree.
      - name: Validate regenerated tree
        run: node .deplugin/ce-validate.mjs

      - name: No changes
        if: steps.sync.outputs.decision == 'nochange'
        run: echo "Up to date with upstream — nothing to do."

      # CONTENT-ONLY change -> PR that merges automatically once checks pass.
      # (Same zero-touch outcome as a direct push, but with an audit trail and the
      # validate workflow actually running against the change first.)
      - name: Open auto-merge PR for content-only update
        id: content_pr
        if: steps.sync.outputs.decision == 'automerge'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream-content
          base: main
          commit-message: "chore(sync): content-only update from upstream — ${{ steps.sync.outputs.summary }}"
          title: "sync: content-only upstream update (auto-merge)"
          body: |
            Automated upstream sync classified this change as **content-only** (closure sets identical,
            no skill added/removed — skill or persona body text only), which auto-merges once the
            validate checks pass. No human action needed; this PR exists for the audit trail.

            **What changed:** ${{ steps.sync.outputs.summary }}
          labels: upstream-sync
          delete-branch: true

      - name: Enable auto-merge on the content PR
        if: steps.sync.outputs.decision == 'automerge' && steps.content_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --auto "${{ steps.content_pr.outputs.pull-request-number }}" \
            || echo "::warning::Could not enable auto-merge (enable 'Allow auto-merge' in repo settings); PR left open for manual merge."

      # STRUCTURAL change -> open / update a PR for human review (never auto-merged).
      - name: Open PR for structural change
        if: steps.sync.outputs.decision == 'pr'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream
          base: main
          commit-message: "chore(sync): structural upstream change — ${{ steps.sync.outputs.summary }}"
          title: "sync: structural upstream change (review required)"
          body: |
            Automated upstream sync flagged a **structural** change (skill add/remove or agent closure change),
            which is held for human review — it is NOT auto-merged.

            **What changed:** ${{ steps.sync.outputs.summary }}

            Review the diff under `skills/` and `transform-manifest.json`. The deterministic gates
            (`.deplugin/ce-validate.mjs`, reproducible build) have already passed; this review is to catch
            *semantic* drift the gates cannot see (e.g. a renamed/split persona, a new dispatch idiom the
            convention block doesn't cover).
          labels: upstream-sync
          delete-branch: true
