name: validate

# Structural gate on the committed skills/ tree. No upstream, no LLM, no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate de-plugin-ify invariants
        run: node .deplugin/ce-validate.mjs
