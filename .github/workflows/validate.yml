name: validate

# Two gates on every push/PR:
#   structural-gate    — de-plugin-ify invariants + output-hash integrity + toolchain tests (no network)
#   reproducible-build — re-clone the upstream commit pinned in the manifest, re-run the transform,
#                        assert the committed skills/ + manifest are byte-identical (needs network)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate de-plugin-ify invariants
        run: node .deplugin/ce-validate.mjs
      - name: Toolchain tests (fixtures)
        run: node .deplugin/test/run-tests.mjs

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild from pinned upstream and assert byte-identical
        run: node .deplugin/ce-reproduce.mjs
